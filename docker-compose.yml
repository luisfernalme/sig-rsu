services:
  # Banco de dados PostgreSQL com PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: residuos_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-residuos_db}
      POSTGRES_USER: ${POSTGRES_USER:-residuos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-residuos_password}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - residuos_network

  # Redis para Celery
  redis:
    image: redis:7-alpine
    container_name: residuos_redis
    ports:
      - "6379:6379"
    networks:
      - residuos_network

  # Backend Django
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: residuos_backend
    environment:
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgres://residuos_user:residuos_password@db:5432/residuos_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - ./backend/media:/app/media # ✅ Mapeamento para pasta local
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - residuos_network

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: residuos_frontend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - residuos_network

  # Celery Worker (para tarefas em background)
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: residuos_celery
    environment:
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgres://residuos_user:residuos_password@db:5432/residuos_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks:
      - residuos_network
    command: celery -A config worker -l info

  # Celery Beat (para tarefas agendadas)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: residuos_celery_beat
    environment:
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgres://residuos_user:residuos_password@db:5432/residuos_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    networks:
      - residuos_network
    command: celery -A config beat -l info

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  residuos_network:
    driver: bridge
